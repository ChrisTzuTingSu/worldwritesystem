<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球書寫系統演化圖鑑</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>全球書寫系統演化圖鑑</h1>
        <nav id="system-nav">
            <button data-target="alphabets">全音素文字 (Alphabets)</button>
            <button data-target="abjads">輔音音素文字 (Abjads)</button>
            <button data-target="abugidas">元音附標文字 (Abugidas)</button>
            <button data-target="chinese">語素文字 (漢字)</button>
            <button data-target="japanese">音節文字 (日文)</button>
            <button data-target="korean">特徵文字 (韓文)</button>
        </nav>
    </header>

    <main>
        <section id="description-container"></section>
        <section id="table-container"></section>
    </main>

    <!-- 語言專屬介紹彈出視窗 -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
