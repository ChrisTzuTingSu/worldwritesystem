<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球文字演化與書寫系統圖鑑</title>
    
    <!-- Leaflet 資源 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- svgMap 資源 -->
    <link href="https://cdn.jsdelivr.net/npm/svgmap@2.12.2/dist/svgMap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/svgmap@2.12.2/dist/svgMap.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 基礎版面重置與隱藏機制 */
        body { margin: 0; padding: 0; font-family: system-ui, sans-serif; background: #f8f9fa; color: #2c3e50; }
        .module-section { display: none; width: 100%; height: calc(100vh - 60px); position: relative; overflow: hidden; }
        .module-section.active { display: block; }
        
        /* 頂部全局導覽列 */
        #global-nav { height: 60px; background: #1a252f; display: flex; align-items: center; padding: 0 20px; gap: 15px; }
        #global-nav button { background: transparent; color: #bdc3c7; border: none; font-size: 1rem; cursor: pointer; padding: 10px 15px; transition: color 0.2s; }
        #global-nav button:hover, #global-nav button.active { color: #fff; border-bottom: 2px solid #3498db; }
        
        /* 內部容器佈局預設設定 */
        .content-wrapper { padding: 20px; overflow-y: auto; height: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <nav id="global-nav">
        <button data-target="home-section" class="active">首頁概念</button>
        <button data-target="modern-map-section">現代地理分佈</button>
        <button data-target="history-map-section">歷史演化流變</button>
        <button data-target="system-section">書寫系統分類</button>
        <button data-target="phonetics-section">語音學基礎</button>
    </nav>

    <main id="main-content">
        <!-- 模組一：首頁概念導引 -->
        <section id="home-section" class="module-section active">
            <div class="content-wrapper">
                <h1>全球文字演化與書寫系統圖鑑</h1>
                <p>請選擇上方導覽列以探索不同維度的文字學資料。</p>
            </div>
        </section>

        <!-- 模組二：現代地理分佈 (svgMap) -->
        <section id="modern-map-section" class="module-section">
            <div id="svg-map-container" style="width: 100%; height: 100%;"></div>
        </section>

        <!-- 模組三：歷史演化流變 (Leaflet 滾動敘事) -->
        <section id="history-map-section" class="module-section">
            <div id="leaflet-map-container" style="position: absolute; top: 0; left: 0; width: 60%; height: 100%; z-index: 1;"></div>
            <div id="story-container" style="position: relative; margin-left: 60%; width: 40%; height: 100%; overflow-y: auto; z-index: 2; padding: 0 20px;">
                <!-- 滾動敘事內容將由 JS 注入 -->
            </div>
            <button id="history-back-btn" style="position: absolute; top: 20px; left: 20px; z-index: 1000; display: none;">← 返回全球總覽</button>
        </section>

        <!-- 模組四：書寫系統分類 (靜態表格與發音) -->
        <section id="system-section" class="module-section">
            <div class="content-wrapper">
                <nav id="system-sub-nav">
                    <!-- 原本的表格分類按鈕放此處 -->
                </nav>
                <div id="description-container"></div>
                <div id="table-container"></div>
            </div>
        </section>

        <!-- 模組五：語音學基礎指引 -->
        <section id="phonetics-section" class="module-section">
            <div class="content-wrapper">
                <h2>語音學基礎指引</h2>
                <p>此模組建置中。</p>
            </div>
        </section>
    </main>
<!-- 彈出視窗 (Modal) 結構 -->
    <div id="detail-modal" class="modal-hidden">
        <div class="modal-content">
            <span id="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
