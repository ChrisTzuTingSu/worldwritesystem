<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球書寫系統演化圖鑑</title>
    <link href="https://cdn.jsdelivr.net/npm/svgmap@2.12.2/dist/svgMap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svgmap@2.12.2/dist/svgMap.min.js"></script>
</head>
<body>
    <header>
        <h1>全球書寫系統演化圖鑑</h1>
        <nav id="system-nav">
            <button data-target="alphabets">全音素文字 (Alphabets)</button>
            <button data-target="abjads">輔音音素文字 (Abjads)</button>
            <button data-target="abugidas">元音附標文字 (Abugidas)</button>
            <button data-target="chinese">語素文字 (漢字)</button>
            <button data-target="japanese">音節文字 (日文)</button>
            <button data-target="korean">特徵文字 (韓文)</button>
            <button data-target="map_view" id="map-btn">世界語言地圖 (Map)</button>
        </nav>
    </header>

    <main>
        <div id="tabular-view">
            <section id="description-container"></section>
            <section id="table-container"></section>
        </div>

        <div id="map-view" class="hidden">
            <section id="map-description">
                <h2>世界語言分佈與書寫系統</h2>
                <p>請點選地圖上的國家板塊，檢視該國主要使用之語言與文字系統詳細資料。</p>
            </section>
            <div id="map-container"></div>
        </div>
    </main>

    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

    <script src="js/app.js"></script>
</body>
</html>
